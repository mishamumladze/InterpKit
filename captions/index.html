<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Captions Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <span id="status">Connecting to captions…</span>
        <span id="dot"></span>
    </header>

    <div id="captions"></div>

    <footer>Win + Ctrl + L opens Live Captions - Ctrl + scroll to zoom</footer>

    <script>
        const WS_URL = 'ws://localhost:8765';
        const RECONNECT_DELAY = 2000;
        const BOTTOM_SLACK = 60;

        const statusEl = document.getElementById('status');
        const dotEl = document.getElementById('dot');
        const captionsEl = document.getElementById('captions');

        let ws = null;
        let reconnectTimer = null;
        let pinnedToBottom = true;

        // The transcript only ever grows (capture.py rewrites nothing but its
        // newest line), so keep one long-lived text node and patch just the tail
        // that changed. Assigning textContent would replace the node and drop the
        // user's selection four times a second.
        const textNode = document.createTextNode('');
        captionsEl.appendChild(textNode);
        captionsEl.classList.add('empty');
        let renderedText = '';

        // Text that arrived while the user was dragging a selection. Applied on
        // pointerup so the paragraph cannot reflow underneath the pointer.
        let dragging = false;
        let pendingText = null;

        captionsEl.addEventListener('scroll', () => {
            const distance = captionsEl.scrollHeight - captionsEl.scrollTop - captionsEl.clientHeight;
            pinnedToBottom = distance < BOTTOM_SLACK;
        });

        window.addEventListener('pointerdown', (event) => {
            if (captionsEl.contains(event.target)) dragging = true;
        });

        function endDrag() {
            if (!dragging) return;
            dragging = false;
            if (pendingText !== null) {
                const text = pendingText;
                pendingText = null;
                render(text);
            }
        }

        window.addEventListener('pointerup', endDrag);
        window.addEventListener('pointercancel', endDrag);
        window.addEventListener('blur', endDrag);

        function setStatus(state, message) {
            statusEl.textContent = message;
            dotEl.className = state;
        }

        function hasSelection() {
            const selection = window.getSelection();
            return Boolean(
                selection &&
                !selection.isCollapsed &&
                selection.rangeCount > 0 &&
                captionsEl.contains(selection.getRangeAt(0).commonAncestorContainer)
            );
        }

        function selectionOffsets() {
            const selection = window.getSelection();
            if (!selection || selection.isCollapsed || selection.rangeCount === 0) return null;
            const range = selection.getRangeAt(0);
            // Everything lives in the single text node, so offsets map 1:1.
            if (range.startContainer !== textNode || range.endContainer !== textNode) return null;
            return {
                start: range.startOffset,
                end: range.endOffset,
                backward: selection.direction === 'backward',
            };
        }

        function restoreSelection(saved) {
            const selection = window.getSelection();
            if (!selection) return;
            const length = renderedText.length;
            const start = Math.min(saved.start, length);
            const end = Math.min(saved.end, length);
            if (start >= end) return;

            if (saved.backward && typeof selection.setBaseAndExtent === 'function') {
                selection.setBaseAndExtent(textNode, end, textNode, start);
            } else {
                const range = document.createRange();
                range.setStart(textNode, start);
                range.setEnd(textNode, end);
                selection.removeAllRanges();
                selection.addRange(range);
            }
        }

        function render(text) {
            if (text === renderedText) return;

            const previous = renderedText;
            const selection = dragging ? null : selectionOffsets();

            let common = 0;
            const max = Math.min(previous.length, text.length);
            while (common < max && previous.charCodeAt(common) === text.charCodeAt(common)) {
                common += 1;
            }

            if (common === previous.length) {
                textNode.appendData(text.slice(common));
            } else {
                textNode.replaceData(common, previous.length - common, text.slice(common));
            }

            renderedText = text;
            captionsEl.classList.toggle('empty', text.length === 0);

            // Only touch the selection when the rewritten tail actually reached it.
            if (selection && common < selection.end) restoreSelection(selection);

            if (pinnedToBottom && !hasSelection()) {
                captionsEl.scrollTop = captionsEl.scrollHeight;
            }
        }

        function connect() {
            clearTimeout(reconnectTimer);
            setStatus('retry', 'Connecting to captions…');

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus('live', 'Live');
            };

            ws.onmessage = (event) => {
                let data;
                try {
                    data = JSON.parse(event.data);
                } catch (err) {
                    console.error('Bad message from capture.py:', event.data, err);
                    return;
                }

                if (typeof data.text !== 'string') return;

                if (dragging) {
                    pendingText = data.text;
                    return;
                }

                render(data.text);
            };

            ws.onclose = () => {
                setStatus('retry', 'Disconnected — is capture.py running? Retrying…');
                reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        connect();
    </script>
</body>
</html>
